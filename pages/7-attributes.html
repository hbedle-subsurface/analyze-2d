<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../assets/glossary.css">
<title>7. Attributes — Analyze 2D</title>
</head>
<body>
<div class="dash">
  <aside class="side" id="side">
    <h2>Attributes<button class="help" data-help="compare">Learn more</button></h2>
    <div class="guide"><p>Tick the attributes to compute and press Show. Each one is drawn
    under the section on the same axes, and the table below the panels gives the correlation
    between every pair.</p></div>
    <div class="checks" id="checks"></div>
    <div class="btnrow">
      <button class="primary" id="btnShow">Show selected</button>
      <button id="btnDefault">Default six</button>
      <button id="btnNone">Clear</button>
    </div>

    <h2>Windows</h2>
    <label>Event window <b><span id="v-aw"></span> ms</b></label>
    <input type="range" id="attrWin" min="4" max="200" step="2" value="20">
    <label>Interval window <b><span id="v-awi"></span> ms</b></label>
    <input type="range" id="attrWinI" min="20" max="600" step="10" value="100">
    <label>Band center frequency <b><span id="v-fc"></span> Hz</b></label>
    <input type="range" id="attrFc" min="4" max="120" step="1" value="30">
    <label>Structure-tensor window <b><span id="v-ts"></span> samples</b></label>
    <input type="range" id="tSig" min="0.8" max="8" step="0.1" value="3">
    <label>Teager-Kaiser derivative length <b><span id="v-dl"></span> points</b></label>
    <input type="range" id="attrDl" min="5" max="9" step="2" value="7">
    <p class="hint" id="winInfo"></p>
  </aside>

  <main class="stage" id="stage">
    <div class="status"><span id="where"></span><span class="busy" id="busy" hidden></span></div>
    <div class="banner" id="stripe" hidden></div>
    <div class="panels" id="panels"></div>
    <div class="figrow">
      <div><h3>Correlation between the displayed attributes</h3><div class="corr" id="corr"></div></div>
      <div class="note" id="note"></div>
    </div>
    <div id="next"></div>
  </main>
</div>

<script src="../js/store.js"></script>
<script src="../js/dsp.js"></script>
<script src="../js/spectrum.js"></script>
<script src="../js/display.js"></script>
<script src="../js/attributes.js"></script>
<script src="../js/help.js"></script>
<script src="../js/glossary.js"></script>
<script src="../js/common.js"></script>
<script>
const GROUPS = [
  ["Amplitude", ["envelope", "rms", "sweetness", "tke", "tkv", "avt", "rai"]],
  ["Phase and frequency", ["insphase", "cosphase", "unwrap", "insfreq", "wavfreq", "wavphase", "avgfreq", "avgband", "band", "rgb"]],
  ["Geometric", ["dip", "linearity", "coherence"]],
  ["Display", ["relief", "reliefrgb"]]
];
const DEFAULT_SET = ["avt", "rms", "dip", "coherence", "avgfreq", "avgband"];
const STRIPE_LIMIT = 0.80;
let SEC = null, SPEC = null, TENSOR = null, TSIG = -1, SHOWN = [], PIDS = [];

function reliefScale(src, p, nx, ns){ return reliefScaleFor(src, nx, ns, p.relAz, p.relAlt, 2.0); }

(async function init(){
  await pageShell("attributes");
  if (!LINE){ emptyState($("stage"), "No line is open."); return; }
  SEC = sectionOf(await stageInput(null));
  if (!SEC || SEC.stage === "raw"){ emptyState($("stage"), "The crop has not been stored yet."); return; }
  $("where").innerHTML = "Computed on <b>" + STAGE_NAMES[SEC.stage] + "</b>";
  const band = await kvGet("band");
  SPEC = band ? {stats: {fpk: band.fpk}} : null;
  $("checks").innerHTML = GROUPS.map(([g, keys]) => "<h4>" + g + "</h4>" + keys.map(k =>
    '<label><input type="checkbox" value="' + k + '"> ' + ATTR_META[k].n +
    '<button class="help" data-help="' + k + '" type="button">?</button></label>').join("")).join("");
  const saved = await kvGet("attrParams");
  if (saved){
    ["attrWin", "attrWinI", "attrFc", "tSig", "attrDl"].forEach(k => { if (saved[k] !== undefined) $(k).value = saved[k]; });
    $("winInfo").textContent = "Windows as last set on this page.";
  } else if (band && (band.fc || band.fpk) > 0){
    const f = band.fc || band.fpk;
    $("attrWin").value = Math.max(4, Math.round(1500 / f / 2) * 2);
    $("attrWinI").value = Math.max(20, Math.round(3000 / f / 10) * 10);
    $("attrFc").value = Math.round(f);
    $("tSig").value = Math.max(1.5, Math.min(6, Math.round(1000 / f / (SEC.dt / 1000) / 2 * 10) / 10));
    $("winInfo").textContent = "Windows start at 1.5 and 3 periods of the " + f.toFixed(0) +
      " Hz center of the band measured on step 2, and the tensor window at half a period.";
  } else {
    $("winInfo").textContent = "Step 2 has not measured the band, so the windows are generic values for 2 to 4 ms data.";
  }
  const sel = (await kvGet("attrSel")) || DEFAULT_SET;
  setSelection(sel);
  syncLabels();
  displayControls($("side"), () => { drawSeisPanel(); });
  makePanel($("panels"), "pSeis", "Seismic amplitude", {height: 220});
  attachReadout("pSeis"); linkGroup("pSeis");
  drawSeisPanel();
  $("next").innerHTML = nextLink("attributes");
  glossaryScan(document.querySelector("aside"));
  show();
})();

function params(){
  return {attrWin: +$("attrWin").value, attrWinI: +$("attrWinI").value, attrFc: +$("attrFc").value,
          tSig: +$("tSig").value, attrDl: +$("attrDl").value,
          relAz: 315, relAlt: 30, relSurf: "env", relSm: 0.4, relZ: 1, cmap: DISP.cmap};
}
function syncLabels(){
  $("v-aw").textContent = $("attrWin").value; $("v-awi").textContent = $("attrWinI").value;
  $("v-fc").textContent = $("attrFc").value; $("v-ts").textContent = (+$("tSig").value).toFixed(1);
  $("v-dl").textContent = $("attrDl").value;
}
function selected(){ return [...document.querySelectorAll("#checks input:checked")].map(x => x.value); }
function setSelection(keys){ document.querySelectorAll("#checks input").forEach(x => { x.checked = keys.includes(x.value); }); }

function drawSeisPanel(){ if (SEC) drawSeis("pSeis", SEC, SEC.data); }

async function show(){
  const keys = selected();
  const p = params();
  await kvSet("attrSel", keys);
  await kvSet("attrParams", {attrWin: p.attrWin, attrWinI: p.attrWinI, attrFc: p.attrFc, tSig: p.tSig, attrDl: p.attrDl});
  $("btnShow").disabled = true;
  PIDS.forEach(id => { const el = $(id); if (el) el.remove(); });
  PIDS = []; SHOWN = [];
  if (keys.some(k => ["dip", "linearity", "coherence"].includes(k)) && (!TENSOR || TSIG !== p.tSig)){
    setBusy("Structure tensor…"); await nextFrame();
    TENSOR = computeTensor(SEC.data, SEC.nx, SEC.ns, p.tSig); TSIG = p.tSig;
  }
  const C = attrCache(SEC.data, SEC.nx, SEC.ns, SEC.dt, TENSOR);
  for (const k of keys){
    setBusy("Computing " + ATTR_META[k].n.toLowerCase() + "…");
    await nextFrame();
    let m;
    try { m = computeOne(k, p, C); } catch (e){ console.error(e); continue; }
    if (!m) continue;
    const id = "pa-" + k;
    makePanel($("panels"), id, m.title, {height: 200});
    PIDS.push(id);
    if (m.rgb) drawRGBPanel(id, SEC, m.rgb, m.scales, m.unit);
    else drawAttrPanel(id, SEC, m.a, m.vmin, m.vmax, m.cmapDefault, m.cbLabel, m.unit);
    attachReadout(id); linkGroup(id);
    SHOWN.push(m);
  }
  setBusy("");
  $("btnShow").disabled = false;
  correlation();
  striping();
}

/* Guide lines: the pointer position drawn on every panel on the page. */
function linkGroup(id){
  const fr = $(id + "-frame");
  fr.addEventListener("mousemove", ev => {
    const r = fr.getBoundingClientRect();
    const u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
    ["pSeis", ...PIDS].forEach(k => {
      const cv = $(k + "-ovl"); if (!cv) return;
      const {ctx, w, h} = fitCanvas(cv);
      ctx.strokeStyle = "rgba(11,114,133,0.9)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(u * w, 0); ctx.lineTo(u * w, h); ctx.moveTo(0, v * h); ctx.lineTo(w, v * h); ctx.stroke();
    });
  });
  fr.addEventListener("mouseleave", () => ["pSeis", ...PIDS].forEach(k => { const cv = $(k + "-ovl"); if (cv) fitCanvas(cv); }));
}

function correlation(){
  const real = SHOWN.filter(m => m.a);
  if (real.length < 2){ $("corr").innerHTML = '<p class="hint">Two or more single-valued attributes are needed.</p>'; $("note").innerHTML = ""; return; }
  const N = real[0].a.length, stride = Math.max(1, Math.floor(N / 120000));
  const cols = real.map(m => {
    const v = []; for (let k = 0; k < N; k += stride) v.push(isFinite(m.a[k]) ? m.a[k] : 0);
    let mu = 0; for (const x of v) mu += x; mu /= v.length;
    let sd = 0; for (const x of v) sd += (x - mu) * (x - mu); sd = Math.sqrt(sd / v.length) || 1;
    return {v, mu, sd};
  });
  const n = real.length, R = [];
  for (let i = 0; i < n; i++){ R.push([]); for (let j = 0; j < n; j++){
    if (j < i){ R[i].push(R[j][i]); continue; }
    const A = cols[i], B = cols[j]; let acc = 0;
    for (let k = 0; k < A.v.length; k++) acc += (A.v[k] - A.mu) * (B.v[k] - B.mu);
    R[i].push(Math.max(-1, Math.min(1, acc / (A.v.length * A.sd * B.sd))));
  }}
  const lut = buildLUT("vik");
  const cell = r => { const q = Math.round((r + 1) / 2 * 511), c = [lut[q*3], lut[q*3+1], lut[q*3+2]];
    return 'style="background:rgb(' + c + ');color:' + (c[0]*.299 + c[1]*.587 + c[2]*.114 > 140 ? "#16191C" : "#fff") + '"'; };
  let h = "<table><tr><th></th>" + real.map(m => "<th>" + ATTR_META[m.key].s + "</th>").join("") + "</tr>";
  for (let i = 0; i < n; i++){
    h += "<tr><th>" + ATTR_META[real[i].key].s + "</th>";
    for (let j = 0; j < n; j++) h += "<td " + cell(R[i][j]) + (Math.abs(R[i][j]) > 0.8 && i !== j ? ' class="hi"' : "") + ">" + (i === j ? "1" : R[i][j].toFixed(2)) + "</td>";
    h += "</tr>";
  }
  $("corr").innerHTML = h + "</table>";
  const pairs = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (Math.abs(R[i][j]) > 0.8)
    pairs.push(ATTR_META[real[i].key].n.toLowerCase() + " and " + ATTR_META[real[j].key].n.toLowerCase() + " (" + R[i][j].toFixed(2) + ")");
  $("note").innerHTML = "<p>" + (pairs.length
    ? "Correlated above 0.8: " + pairs.join("; ") + ". A pair this close carries close to one measurement between them, and counts as a single dimension in the self-organizing map on the next step."
    : "No pair of the displayed attributes correlates above 0.8.") +
    " Correlation is computed on the signed values, so a signed attribute and a magnitude can read near zero while their magnitudes follow each other.</p>";
}

/* Lateral continuity: the correlation between neighboring traces. Most of the
   frequency and phase attributes are computed one trace at a time, so low
   values there come from the input rather than from the attribute. */
function striping(){
  const bad = [];
  for (const m of SHOWN){ if (!m.a) continue; const rx = lateralContinuity(m.a, SEC.nx, SEC.ns); if (rx !== null && rx < STRIPE_LIMIT) bad.push([m, rx]); }
  if (!bad.length){ $("stripe").hidden = true; return; }
  bad.sort((a, b) => a[1] - b[1]);
  const oneTrace = bad.some(([m]) => ["avgfreq","avgband","insfreq","insphase","cosphase","unwrap","wavfreq","wavphase"].includes(m.key));
  $("stripe").hidden = false;
  $("stripe").innerHTML = "<h3>These attributes are striped<button class=\"help\" data-help=\"stripe\">Learn more</button></h3>" +
    "<p>Neighboring traces correlate at " + bad.map(([m, r]) => m.title.toLowerCase() + " <b>" + r.toFixed(2) + "</b>").join(", ") +
    ", below " + STRIPE_LIMIT.toFixed(2) + ". Vertical stripes of this kind carry into the self-organizing map as classes that change from trace to trace. " +
    (oneTrace ? "The frequency and phase attributes contain no lateral operator, so their continuity comes entirely from the input. " : "") +
    "The f-k filter (step 3) and structure-oriented smoothing (step 4) both add lateral continuity to the input, " +
    "and their removed panels show the energy each takes out.</p>" +
    '<p><a href="3-fk.html">Step 3: f-k filter</a> &nbsp; <a href="4-sos.html">Step 4: structure-oriented smoothing</a></p>';
}

["attrWin", "attrWinI", "attrFc", "tSig", "attrDl"].forEach(k => $(k).addEventListener("input", syncLabels));
$("btnShow").addEventListener("click", show);
$("btnDefault").addEventListener("click", () => setSelection(DEFAULT_SET));
$("btnNone").addEventListener("click", () => setSelection([]));
window.addEventListener("resize", debounce(() => {
  drawSeisPanel();
  SHOWN.forEach(m => { const id = "pa-" + m.key; if (m.rgb) drawRGBPanel(id, SEC, m.rgb, m.scales); else drawAttrPanel(id, SEC, m.a, m.vmin, m.vmax, m.cmapDefault, m.cbLabel); });
}, 250));
</script>
<script src="../assets/count.js"></script>
</body>
</html>
