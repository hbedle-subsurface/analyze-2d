<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/glossary.css">
<link rel="stylesheet" href="../css/style.css">
<title>3. f-k filter — Analyze 2D</title>
</head>
<body>
<div class="dash">
  <aside class="side" id="side">
    <h2>f-k filter<button class="help" data-help="fk">Learn more</button></h2>
    <label class="toggle"><input type="checkbox" id="apply"> Apply this step</label>
    <div class="guide"><p>The filter removes events steeper than the dip limit and
    frequencies outside the pass band. The removed panel shows what went.</p></div>
    <label>Reject dips steeper than <b><span id="v-dip"></span> samples/trace</b></label>
    <input type="range" id="dipMax" min="0.05" max="4" step="0.01" value="1">
    <label>Transition width <b><span id="v-tap"></span></b></label>
    <input type="range" id="dipTap" min="0.01" max="0.6" step="0.01" value="0.1">
    <label>Low cut <b><span id="v-flo"></span> Hz</b></label>
    <input type="range" id="fLo" min="0" max="60" step="1" value="0">
    <label>High cut <b><span id="v-fhi"></span> Hz</b></label>
    <input type="range" id="fHi" min="10" max="250" step="1" value="120">
    <div class="btnrow">
      <button id="btnDip">Dip limit from the data</button>
      <button id="btnBand">Band from step 2</button>
    </div>
    <p class="hint" id="dipInfo"></p>
    <h2>Removed panel</h2>
    <label>Gain on the removed panel <b><span id="v-remGain"></span>×</b></label>
    <input type="range" id="remGain" min="1" max="20" step="0.5" value="4">
  </aside>

  <main class="stage" id="stage">
    <div class="status"><span id="where"></span><span class="busy" id="busy" hidden></span></div>
    <div class="panels" id="panels"></div>
    <div class="figrow">
      <div><h3>f-k spectrum of the input, rejected region shaded</h3>
        <div class="plotbox"><canvas id="fk" width="520" height="260" style="height:260px"></canvas></div></div>
      <div class="note" id="note"></div>
    </div>
    <div id="next"></div>
  </main>
</div>

<script src="../js/store.js"></script>
<script src="../js/dsp.js"></script>
<script src="../js/display.js"></script>
<script src="../js/help.js"></script>
<script src="../js/glossary.js"></script>
<script src="../js/common.js"></script>
<script src="../js/filterpage.js"></script>
<script>
let fkCache = null, DIPSTAT = null, RES = null, FP_SIG = 3;

const params = () => ({dt: FP.input.dt, dipMax: +$("dipMax").value, dipTap: +$("dipTap").value,
                       fLo: +$("fLo").value, fHi: +$("fHi").value});

filterPage({
  stage: "fk", stepId: "fk",
  controls: ["dipMax", "dipTap", "fLo", "fHi"],
  delay: 450,
  async prepare(input, band){
    setBusy("Transforming the input to f-k…");
    await nextFrame();
    fkCache = fkForward(input.data, input.nx, input.ns);
    const nyq = 0.5 / (input.dt * 1e-6);
    $("fHi").max = Math.round(nyq); $("fLo").max = Math.round(Math.min(80, nyq / 2));
    const sig = band && (band.fc || band.fpk) > 0 ? Math.max(1.5, Math.min(6, 1000 / (band.fc || band.fpk) / (input.dt / 1000) / 2)) : 3;
    setBusy("Measuring dips…");
    await nextFrame();
    DIPSTAT = dipStats(computeTensor(input.data, input.nx, input.ns, sig));
    FP_SIG = sig;
    setBusy("");
    $("dipInfo").textContent = DIPSTAT
      ? "On layered parts of the input, half of the dips are below " + DIPSTAT.p50.toFixed(2) +
        " and 99.5% below " + DIPSTAT.p995.toFixed(2) + " samples per trace."
      : "Too few layered samples to measure a dip distribution.";
  },
  defaults(input, band){
    if (DIPSTAT) $("dipMax").value = Math.max(0.05, Math.round(DIPSTAT.p995 * 1.2 / 0.05) * 0.05);
    if (band){ $("fLo").value = Math.max(0, Math.floor(band.lo20)); $("fHi").value = Math.min(+$("fHi").max, Math.ceil(band.hi20)); }
    else $("fHi").value = $("fHi").max;
  },
  setParams(p){ $("dipMax").value = p.dipMax; $("dipTap").value = p.dipTap; $("fLo").value = p.fLo; $("fHi").value = p.fHi; },
  readParams: params,
  syncLabels(){
    $("v-dip").textContent = (+$("dipMax").value).toFixed(2);
    $("v-tap").textContent = (+$("dipTap").value).toFixed(2);
    $("v-flo").textContent = $("fLo").value; $("v-fhi").textContent = $("fHi").value;
  },
  apply: (input, p) => fkApply(fkCache, input.nx, input.ns, p),
  after(){
    const cv = $("fk");
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(200, Math.round(r.width)); cv.height = 260;
    drawFK(cv, params(), FP.input.nx, FP.input.ns, FP.input.dt);
    RES = FP.on ? residualStats(FP.removed, FP.input.nx, FP.input.ns, {sosSig: FP_SIG, dipMax: +$("dipMax").value}) : null;
    $("note").innerHTML = FP.cfg.note(FP);
  },
  note(fp){
    if (!fp.on) return "<p>The step is skipped, so the next step works on " + STAGE_NAMES[fp.input.stage] + ".</p>";
    let s = "<p>The removed part carries " + fp.pct.toFixed(1) + "% of the input energy.";
    if (RES) s += " Of the removed samples, " + (100 * RES.lin).toFixed(0) + "% are organized into oriented events; of those, " +
      (100 * RES.steep).toFixed(0) + "% dip more steeply than the limit. Oriented events beyond the limit are rejected " +
      "coherent energy, and oriented events at the limit follow the edge of the rejected wedge.";
    return s + "</p><p>Reflector geometry in the removed panel, such as layering or a fault plane, " +
      "is signal that the current dip limit rejects.</p>";
  }
});

$("btnDip").addEventListener("click", () => {
  if (!DIPSTAT) return;
  $("dipMax").value = Math.max(0.05, Math.round(DIPSTAT.p995 * 1.2 / 0.05) * 0.05);
  $("dipMax").dispatchEvent(new Event("input"));
});
$("btnBand").addEventListener("click", async () => {
  const b = await kvGet("band");
  if (!b) { $("dipInfo").textContent = "Step 2 has not measured the band yet."; return; }
  $("fLo").value = Math.max(0, Math.floor(b.lo20)); $("fHi").value = Math.ceil(b.hi20);
  $("fHi").dispatchEvent(new Event("input"));
});
</script>
<script src="../assets/count.js"></script>
</body>
</html>
